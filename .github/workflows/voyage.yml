name: "Daybreak"
run-name: "lagoon"
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
permissions:
  id-token: write
  pages: write
  contents: read
jobs:
  Fjord:
    runs-on: ubuntu-24.04
    environment:
      name: "github-pages"
      url: ${{ steps.Arbor.outputs.page_url }}
    steps:
      - name: "Yarrow"
        uses: actions/checkout@v7
      - name: "Cactus"
        uses: actions/configure-pages@v5
      - name: "Petunia"
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: "FIELD"
        id: Arbor
        uses: actions/deploy-pages@v4
